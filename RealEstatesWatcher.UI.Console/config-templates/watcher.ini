; Copy this file to configs/watcher.ini and edit it for your searches.
; Run: dotnet RealEstatesWatcher.UI.Console.dll --config configs/watcher.ini
; Relative file paths use the working directory.
; The Node.js executable path must be absolute when specified.

[general]
check_interval_minutes=10
; Optional exact time of day for periodic checks (HH:mm:ss).
start_periodic_check_at=
perform_check_on_startup=true
enable_multiple_portal_instances=true

[gcloud]
enable_cloud_logging=false
application_id=
project_id=
service_name=

[portals]
; One URL per uniquely numbered key. Use ; to comment out a whole entry.
0=https://reality.idnes.cz/s/prodej/byty/
; 1=https://www.sreality.cz/hledani/prodej/byty

[email]
enabled=false
from=
to=
cc=
bcc=
sender_name=
username=
password=
smtp_server_host=
smtp_server_port=
use_secure_connection=true
skip_initial_notification=false

[file]
enabled=true
main_path=ads.txt
separate_new_posts=false
new_posts_path=
; Allowed values: PlainText, Html (case-insensitive).
print_format=PlainText

; Optional filtering: uncomment this entire block to enable it.
; Leave a value empty to omit that constraint.
; [basic]
; price_min=
; price_max=
; layouts=
; floor_area_min=
; floor_area_max=

; Optional Node.js scraper: uncomment this entire block for dynamic portals.
; Install Node.js dependencies in scraper/ with npm ci first (see README).
; [nodejs]
; path_to_node_executable=
; path_to_script=scraper/index.js
; page_scraping_timeout_seconds=60
; path_to_cookies_file=
